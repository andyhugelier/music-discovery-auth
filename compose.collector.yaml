# Additive deployment: the existing music-discovery-test service stays separate.
services:
  collector:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: music-discovery-collector:local
    container_name: music-discovery-collector
    user: "1027:100"
    working_dir: /app
    environment:
      MUSIC_CONFIG_PATH: /app/config/private/apple-music.json
    volumes:
      - ./Secrets:/run/secrets:ro
      - ./Config:/app/config:ro
      - ./Data:/app/data
    mem_limit: 128m
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "/app/collector.py", "healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
