
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Discovery — Apple Music</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 480px;
      margin: 60px auto;
      padding: 20px;
      line-height: 1.5;
    }
    button, input {
      font: inherit;
      padding: 12px;
      margin: 8px 0;
      max-width: 100%;
      box-sizing: border-box;
    }
    input { width: 100%; }
    button { cursor: pointer; }
    #status, #results { white-space: pre-wrap; }
  </style>
  <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"></script>
</head>
<body>
  <h1>Music Discovery</h1>
  <p>Test access to your personal Apple Music data.</p>

  <label for="token">Temporary developer token</label>
  <input id="token" type="password"
         placeholder="Paste token here"
         autocomplete="off">

  <button id="connect">Prepare Apple Music</button>
  <button id="recent" disabled>Test Recent Plays</button>
  <button id="copy-token" disabled>Copy NAS authorization token</button>
  <button id="clear-clipboard">Clear clipboard</button>
  <p>Copy the token only when you are ready to paste it into the NAS's hidden
    SSH prompt. Treat it like a password. Clear your clipboard afterward;
    clipboard history or sync may retain a copy.</p>

  <p id="status">Waiting for authorization.</p>
  <div id="results"></div>

  <script src="auth.js"></script>
</body>
</html>
