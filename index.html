
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Discovery — Apple Music</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 480px;
      margin: 60px auto;
      padding: 20px;
      line-height: 1.5;
    }
    button, input {
      font: inherit;
      padding: 12px;
      margin: 8px 0;
      max-width: 100%;
      box-sizing: border-box;
    }
    input { width: 100%; }
    button { cursor: pointer; }
    #status, #results { white-space: pre-wrap; }
  </style>
  <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"></script>
</head>
<body>
  <h1>Music Discovery</h1>
  <p>Test access to your personal Apple Music data.</p>

  <label for="token">Temporary developer token</label>
  <input id="token" type="password"
         placeholder="Paste token here"
         autocomplete="off">

  <button id="connect">Connect to Apple Music</button>
  <button id="recent" disabled>Test Recent Plays</button>

  <p id="status">Waiting for authorization.</p>
  <div id="results"></div>

  <script>
    const status = document.getElementById("status");
    const connect = document.getElementById("connect");
    const recent = document.getElementById("recent");
    const results = document.getElementById("results");

    let music;

    connect.addEventListener("click", async () => {
      connect.disabled = true;
      status.textContent = "Initializing MusicKit...";

      try {
        const token = document.getElementById("token").value.trim();
        if (!token) throw new Error("Enter a developer token first.");

        await MusicKit.configure({
          developerToken: token,
          app: { name: "Music Discovery", build: "1.0" }
        });

        music = MusicKit.getInstance();
        status.textContent = "Requesting authorization...";

        await music.authorize();

        document.getElementById("token").value = "";
        recent.disabled = false;
        status.textContent = "Apple Music connected!";
      } catch (error) {
        status.textContent =
          "Authorization failed: " + (error.message || "Unknown error");
      } finally {
        connect.disabled = false;
      }
    });

    recent.addEventListener("click", async () => {
      recent.disabled = true;
      status.textContent = "Fetching recently played tracks...";
      results.textContent = "";

      try {
        const response = await music.api.music(
          "/v1/me/recent/played/tracks",
          { limit: 10 }
        );

        const tracks = response.data.data || [];

        if (!tracks.length) {
          results.textContent = "No recent tracks returned.";
        } else {
          results.textContent = tracks.map(track => {
            const a = track.attributes || {};
            return `${a.artistName || "Unknown artist"} — ${a.name || "Unknown track"}`;
          }).join("\n");
        }

        status.textContent = "Recent plays request completed.";
      } catch (error) {
        status.textContent =
          "Recent plays failed: " + (error.message || "Unknown error");
      } finally {
        recent.disabled = false;
      }
    });
  </script>
</body>
</html>
